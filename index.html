<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MyoGuide">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<title>MyoGuide</title>
<style>
html,body{margin:0;height:100%;background:#faf9f5;color:#262c2b;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.gate{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
svg{width:56px;height:56px;margin:0 auto 4px}h1{margin:0;font-size:26px;letter-spacing:-.5px}p{margin:0;color:#6b716c;font-size:14px}
input{font:inherit;font-size:20px;text-align:center;padding:14px;border:1px solid #d9dccf;border-radius:14px;background:#fff;color:#262c2b;letter-spacing:1px}
button{font:inherit;font-weight:800;font-size:17px;padding:15px;border:0;border-radius:14px;background:#ff8659;color:#2e241f}
input:focus{outline:none;border-color:#262c2b;box-shadow:0 0 0 3px rgba(38,44,43,.15)}button:disabled{opacity:.6}#msg{min-height:20px;color:#b2452a;font-size:14px}
</style></head><body><div class="gate" id="gate" hidden>
<form id="f" autocomplete="off">
<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#ff8659"/><path d="M10 27V18M20 27V10M30 27V15" stroke="#262c2b" stroke-width="5" stroke-linecap="round"/></svg>
<h1>MyoGuide demo</h1><p>Enter the access code to open the prototype.</p>
<input id="code" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Access code" placeholder="Access code">
<button id="go" type="submit">Open</button><div id="msg" role="status"></div>
</form></div>
<script>
(function () {
  var ITER = 250000, KEY = 'myoguide.demo.key', PAGES = ["index.html", "live.html", "directions.html"], MIME = {".html": "text/html", ".css": "text/css", ".js": "text/javascript", ".png": "image/png", ".ttf": "font/ttf", ".svg": "image/svg+xml", ".txt": "text/plain", ".json": "application/json", ".webmanifest": "application/manifest+json"};
  var $ = function (id) { return document.getElementById(id); };
  var b64 = function (u8) { var s = ''; for (var i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
  var unb64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var norm = function (c) { return c.replace(/[\s\-_]/g, '').toLowerCase(); };
  var bundle = fetch('bundle.bin', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('bundle ' + r.status); return r.arrayBuffer(); });

  function keyFromCode(code, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function open(key, buf) {
    var u = new Uint8Array(buf);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(16, 28) }, key, u.subarray(28)).then(function (plain) { return { key: key, plain: new Uint8Array(plain) }; });
  }
  function run(plain) {
    var hl = new DataView(plain.buffer).getUint32(0, true);
    var index = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + hl))), data = plain.subarray(4 + hl);
    var file = function (p) { var e = index[p]; return data.subarray(e[0], e[0] + e[1]); };
    var ext = function (p) { return p.slice(p.lastIndexOf('.')); };
    var urls = {}, imap = {};
    var swap = function (s) { return s.replace(/@@F:([^@]+)@@/g, function (_, p) { return urls[p] || p; }); };
    var paths = Object.keys(index);
    // binaries first, then css/js (which may point at binaries), then pages
    paths.filter(function (p) { return ['.css', '.js', '.html'].indexOf(ext(p)) < 0; }).forEach(function (p) {
      urls[p] = URL.createObjectURL(new Blob([file(p)], { type: MIME[ext(p)] || 'application/octet-stream' }));
    });
    paths.filter(function (p) { return ext(p) === '.css' || ext(p) === '.js'; }).forEach(function (p) {
      urls[p] = URL.createObjectURL(new Blob([swap(new TextDecoder().decode(file(p)))], { type: MIME[ext(p)] }));
      if (ext(p) === '.js') imap['@m/' + p] = urls[p];
    });
    var page = new URLSearchParams(location.search).get('p') || 'index.html';
    if (PAGES.indexOf(page) < 0) page = 'index.html';
    var html = swap(new TextDecoder().decode(file(page)));
    html = html.replace(/<head>/i, '<head><script type="importmap">' + JSON.stringify({ imports: imap }) + '<\/script>');
    document.open(); document.write(html); document.close();
  }
  function ask(message) {
    $('gate').hidden = false; $('msg').textContent = message || ''; $('code').focus();
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value; if (!norm(code)) return;
    $('go').disabled = true; $('msg').textContent = 'Opening...';
    bundle.then(function (buf) {
      return keyFromCode(code, new Uint8Array(buf, 0, 16)).then(function (k) { return open(k, buf); });
    }).then(function (r) {
      return crypto.subtle.exportKey('raw', r.key).then(function (raw) { try { localStorage.setItem(KEY, b64(new Uint8Array(raw))); } catch (x) {} run(r.plain); });
    }).catch(function (err) {
      $('go').disabled = false;
      $('msg').textContent = err && err.name === 'OperationError' ? 'That code did not work. Try again.' : 'Could not load the demo. Check your connection.';
    });
  });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (!saved) { ask(); return; }
  Promise.all([bundle, crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt'])])
    .then(function (v) { return open(v[1], v[0]); })
    .then(function (r) { run(r.plain); })
    .catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} ask(); });
})();
</script></body></html>
